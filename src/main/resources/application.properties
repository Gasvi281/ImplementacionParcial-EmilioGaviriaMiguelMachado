spring.application.name=ImplementacionParcial

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/camel_dwarf_racing}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/camel-dwarf-racing/protocol/openid-connect/certs}
management.endpoints.web.exposure.include=health
