server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mismo truco que el proxy de Vite en desarrollo: el navegador solo habla con este
    # origen, nginx reenvía /api al backend real por la red interna de Docker.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html (React Router).
    location / {
        try_files $uri /index.html;
    }
}
